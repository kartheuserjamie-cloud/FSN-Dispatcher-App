name: Build Unsigned iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: 📦 Install dependencies
        run: npm install

      - name: 🚀 Configure EAS
        run: npx eas-cli init --account femboy-support-network-e-v --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: 🛠 Build with EAS Local (Simulator profile)
        run: npx eas-cli build --platform ios --local --non-interactive --profile production
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Package to IPA
        run: |
          # EAS generiert eine .tar.gz Datei (z.B. build-xxx.tar.gz)
          # Wir entpacken diese und machen daraus eine .ipa
          mkdir -p Payload
          tar -xf build-*.tar.gz
          cp -r *.app Payload/
          zip -qr FSN-Dispatcher.ipa Payload

      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FSN-Dispatcher-IPA
          path: FSN-Dispatcher.ipa
